<body class="antialiased flex flex-col min-h-screen">

    <!-- Chosen Palette: Warm Neutrals & Irish Greens (Background: #FAF8F5, Accents: #A3B18A, #588157, #344E41, Text: #333333) -->
    <!-- Application Structure Plan: La SPA utilizza un'interfaccia a schede stile dashboard. Questa struttura permette all'utente di navigare rapidamente tra le diverse categorie di attività (Logistica, Cultura, Locali, Chicche, Gite) senza perdersi in una pagina eccessivamente lunga, favorendo l'usabilità immediata da mobile e desktop durante il soggiorno Erasmus. Ogni elemento contiene ora un link interattivo per approfondire direttamente sul sito ufficiale. -->
    <!-- Visualization & Content Choices: Spese Erasmus -> Grafico a ciambella con Chart.js per mostrare in modo pulito le proporzioni del budget mensile. Per i luoghi e le gite si usano delle griglie di card interattive e dinamiche con indicatori visivi di cliccabilità (link esterni) per massimizzare l'esplorazione autonoma del territorio. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <header class="site-header text-[#FAF8F5] sticky top-0 z-50">

                    <h1 class="site-brand-title">Erasmus a Cork</h1>

        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 relative">
        <div id="main-content"></div>

    </main>

    <div id="toast" role="status" aria-live="polite"></div>

    <footer class="bg-[#344E41] text-[#FAF8F5] py-6 text-center mt-auto">
        <p class="opacity-80 text-sm">Pronto per il tuo Erasmus estivo a Cork? Esplora le sezioni e organizza le tue settimane! 🇮🇪</p>
    </footer>

    <script>
        const appData = { tabs: [], places: [], config: null };

        async function loadAppData() {
            const base = getBasePath();
            const configRes = await fetch(`${base}data/config.json`, { cache: 'no-store' });
            if (!configRes.ok) throw new Error('config.json');
            const config = await configRes.json();
            appData.config = config;
            appData.tabs = config.tabs || [];

            const files = config.placeFiles || [];
            const placesArrays = await Promise.all(
                files.map(async (name) => {
                    const res = await fetch(`${base}data/places/${name}.json`, { cache: 'no-store' });
                    if (!res.ok) throw new Error(`places/${name}.json`);
                    return res.json();
                })
            );
            appData.places = placesArrays.flat();

            try {
                const coordsRes = await fetch(`${base}data/coordinates.json`, { cache: 'no-store' });
                if (coordsRes.ok) {
                    const coords = await coordsRes.json();
                    appData.places = appData.places.map(p => {
                        const c = coords[p.id];
                        return c ? { ...p, lat: c.lat, lng: c.lng } : p;
                    });
                }
            } catch (_) { /* coordinate opzionali */ }

            if (config.subtitle) {
                const sub = document.getElementById('app-subtitle');
                if (sub) sub.textContent = config.subtitle;
            }
            if (config.erasmus && window.planner?.setErasmusDates) {
                window.planner.setErasmusDates(config.erasmus.start, config.erasmus.end);
            }
            setShareMeta(config);
        }

        function setShareMeta(config) {
            const pageUrl = window.location.href.split('#')[0];
            const ogImage = new URL('assets/og-image.svg', window.location.href).href;
            const title = config?.title ? `${config.title} — Guida interattiva ☘️` : 'Erasmus a Cork — Guida interattiva ☘️';
            const desc = config?.subtitle || 'Guida Erasmus a Cork: musei, ristoranti, pub, gite, meteo e planner.';

            document.title = title.replace(' ☘️', '');
            const setMeta = (id, value) => {
                const el = document.getElementById(id);
                if (el) el.setAttribute('content', value);
            };
            setMeta('meta-og-image', ogImage);
            setMeta('meta-og-url', pageUrl);
            setMeta('meta-twitter-image', ogImage);

            document.querySelector('meta[property="og:title"]')?.setAttribute('content', title);
            document.querySelector('meta[property="og:description"]')?.setAttribute('content', desc);
            document.querySelector('meta[name="description"]')?.setAttribute('content', desc);
            document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', title);
            document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', desc);
        }

        let budgetChartInstance = null;
        let currentTab = 'intro';
        const filterState = { culture: '', food: '', nightlife: '', shopping: '', excursions: '', favOnly: {} };

        function getBasePath() {
            let path = window.location.pathname;
            if (path.endsWith('/index.html')) path = path.slice(0, -10) + '/';
            else if (!path.endsWith('/')) {
                const slash = path.lastIndexOf('/');
                path = slash >= 0 ? path.slice(0, slash + 1) : '/';
            }
            return path;
        }

        function placeById(id) {
            return appData.places.find(p => p.id === id);
        }

        let toastTimer = null;
        function showToast(msg) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('toast--show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('toast--show'), 2800);
        }

        window.App = {
            get places() { return appData.places; },
            placeById,
            switchTab,
            showToast,
            quickAddToPlanner
        };

        function initApp() {
            renderNavigation();
            document.getElementById('site-brand-home')?.addEventListener('click', e => {
                e.preventDefault();
                switchTab('intro');
            });
            switchTab('intro');
        }

        function renderNavigation() {
            const navContainer = document.getElementById('main-nav');
            navContainer.innerHTML = '';
            appData.tabs.forEach(tab => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tab-btn';
                btn.onclick = () => switchTab(tab.id);
                btn.id = `btn-${tab.id}`;
                btn.setAttribute('aria-label', tab.label);
                btn.title = tab.label;
                btn.innerHTML = `<span class="tab-icon" aria-hidden="true">${tab.icon}</span><span class="tab-label">${tab.label}</span>`;
                navContainer.appendChild(btn);
            });
        }

        async function switchTab(tabId) {
            if (currentTab === 'map') window.CorkMap?.destroyCorkMap();
            if (currentTab === 'planner') window.PlannerUI?.destroy();
            if (currentTab === 'program') window.ProgramUI?.destroy();
            currentTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === `btn-${tabId}`) btn.classList.add('active');
            });
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '<div class="text-center text-gray-400 py-8">Caricamento...</div>';
            try {
                const base = getBasePath();
                const resp = await fetch(`${base}sections/${tabId}.html`, { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                mainContent.innerHTML = await resp.text();
                afterTabLoad(tabId);
            } catch (e) {
                mainContent.innerHTML = '<div class="text-center text-red-500 py-8">Errore nel caricamento della sezione.<br><span class="text-sm text-gray-500">Apri il sito tramite un server locale (<code>npx serve .</code>) o pubblicalo su GitHub Pages.</span></div>';
                console.error(e);
            }
        }

        function afterTabLoad(tabId) {
            if (tabId === 'intro') initBudgetChart();
            if (['culture', 'food', 'nightlife', 'shopping', 'excursions'].includes(tabId)) {
                bindSectionFilters(tabId);
                renderContent(tabId);
            }
            if (tabId === 'map') initMapTab();
            if (tabId === 'weather') {
                window.CorkWeather?.init(document.getElementById('weather-root'), {
                    basePath: getBasePath(),
                    erasmus: appData.config?.erasmus
                });
            }
            if (tabId === 'planner') {
                window.PlannerUI.render({
                    places: appData.places,
                    placeById
                });
            }
            if (tabId === 'program') {
                window.ProgramUI?.render(document.getElementById('program-root'), {
                    places: appData.places,
                    placeById,
                    dates: window.planner.getDateRange(),
                    formatDate: window.planner.formatDateIT
                });
            }
        }

        function initMapTab() {
            const filters = document.getElementById('map-filters');
            const refresh = () => window.CorkMap.initCorkMap(appData.places, {
                plans: window.planner.getSavedPlans(),
                onAddToPlanner: (place) => {
                    switchTab('planner').then(() => {
                        setTimeout(() => {
                            const sel = document.getElementById('planner-place');
                            const date = document.getElementById('planner-date');
                            if (sel) sel.value = place.id;
                            if (date) date.value = window.planner.START_DATE;
                            showToast(`${place.title} — compila data e salva`);
                        }, 350);
                    });
                }
            });
            window.CorkMap.renderMapFilters(filters, refresh);
            refresh();
        }

        function bindSectionFilters(tabId) {
            const search = document.getElementById(`${tabId}-search`);
            const favBtn = document.getElementById(`${tabId}-fav-only`);
            if (search) {
                search.value = filterState[tabId] || '';
                search.oninput = () => { filterState[tabId] = search.value; renderContent(tabId); };
            }
            if (favBtn) {
                favBtn.onclick = () => {
                    filterState.favOnly[tabId] = !filterState.favOnly[tabId];
                    favBtn.classList.toggle('bg-[#344E41]', filterState.favOnly[tabId]);
                    favBtn.classList.toggle('text-white', filterState.favOnly[tabId]);
                    renderContent(tabId);
                };
            }
        }

        function filteredPlaces(tabId) {
            const q = (filterState[tabId] || '').toLowerCase();
            const favOnly = filterState.favOnly[tabId];
            return appData.places.filter(p => {
                if (p.category !== tabId) return false;
                if (favOnly && !window.planner.isFavorite(p.id)) return false;
                if (!q) return true;
                const hay = [p.title, p.desc, p.location, p.highlight, p.note, p.hours, p.transport].filter(Boolean).join(' ').toLowerCase();
                return hay.includes(q);
            });
        }

        function renderContent(tabId) {
            const places = filteredPlaces(tabId);
            if (tabId === 'culture') {
                const grid = document.getElementById('culture-grid');
                if (grid) grid.innerHTML = places.map(p => createCard(p, 'bg-white text-gray-800', p.location, 'text-[#588157] bg-green-50')).join('') || emptyMsg();
            } else if (tabId === 'food') {
                const grid = document.getElementById('food-grid');
                if (grid) grid.innerHTML = places.map(p => createCard(p, 'bg-white text-gray-800', p.note, 'text-[#D97757] bg-orange-50')).join('') || emptyMsg();
            } else if (tabId === 'nightlife') {
                const grid = document.getElementById('nightlife-grid');
                if (grid) grid.innerHTML = places.map(p => createCard(p, 'bg-[#2C3E50] text-white', p.highlight, 'text-[#E9EDC9] bg-white bg-opacity-10')).join('') || emptyMsg();
            } else if (tabId === 'shopping') {
                const grid = document.getElementById('shopping-grid');
                if (grid) grid.innerHTML = places.map(p => createCard(p, 'bg-white text-gray-800', p.note, 'text-[#344E41] bg-yellow-50')).join('') || emptyMsg();
            } else if (tabId === 'excursions') {
                const list = document.getElementById('excursions-list');
                if (list) list.innerHTML = places.map(p => createExcursionRow(p)).join('') || emptyMsg();
            }
            bindCardActions();
        }

        function emptyMsg() {
            return '<p class="text-center text-gray-500 py-8 col-span-2">Nessun risultato. Prova un\'altra ricerca.</p>';
        }

        function bindCardActions() {
            document.querySelectorAll('[data-fav]').forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const id = btn.dataset.fav;
                    window.planner.toggleFavorite(id);
                    renderContent(currentTab);
                };
            });
            document.querySelectorAll('[data-add-plan]').forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const place = placeById(btn.dataset.addPlan);
                    if (place) quickAddToPlanner(place);
                };
            });
            document.querySelectorAll('[data-show-map]').forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const place = placeById(btn.dataset.showMap);
                    if (!place?.lat) return;
                    switchTab('map').then(() => {
                        setTimeout(() => {
                            window.CorkMap.initCorkMap(appData.places.filter(p => p.id === place.id), {
                                plans: window.planner.getSavedPlans(),
                                fitZoom: 16,
                                onAddToPlanner: quickAddToPlanner
                            });
                        }, 400);
                    });
                };
            });
        }

        function quickAddToPlanner(place) {
            switchTab('planner').then(() => {
                setTimeout(() => {
                    const sel = document.getElementById('planner-place');
                    const date = document.getElementById('planner-date');
                    if (sel) sel.value = place.id;
                    if (date && !date.value) date.value = window.planner.START_DATE;
                    document.getElementById('planner-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    showToast('Luogo selezionato — scegli data e conferma');
                }, 300);
            });
        }

        function createCard(place, bgClass, badgeText, badgeStyle = 'text-gray-500') {
            const fav = window.planner.isFavorite(place.id);
            const hasUrl = place.url && !place.url.startsWith('#');
            return `
                <article class="place-card ${bgClass} p-6 rounded-2xl shadow-sm flex flex-col h-full border border-gray-100 relative">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-4xl">${place.icon}</span>
                        <div class="flex gap-1 flex-wrap justify-end">
                            <button type="button" data-fav="${place.id}" class="text-lg leading-none px-2 py-1 rounded-lg hover:bg-black hover:bg-opacity-10" title="Preferito">${fav ? '★' : '☆'}</button>
                            ${badgeText ? `<span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full ${badgeStyle}">${badgeText}</span>` : ''}
                        </div>
                    </div>
                    <h3 class="text-xl font-bold mb-2">${place.title}</h3>
                    ${place.hours ? `<p class="text-xs font-semibold opacity-80 mb-2">🕐 ${place.hours}</p>` : ''}
                    <p class="text-sm opacity-90 flex-grow leading-relaxed">${place.desc}</p>
                    <div class="mt-4 pt-3 border-t border-current border-opacity-10 flex flex-wrap gap-2">
                        ${hasUrl ? `<a href="${place.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-black bg-opacity-5 hover:bg-opacity-10">Sito ↗</a>` : ''}
                        ${place.lat != null ? `<button type="button" data-show-map="${place.id}" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#E9EDC9] text-[#344E41] hover:bg-[#A3B18A]">Mappa</button>` : ''}
                        <button type="button" data-add-plan="${place.id}" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#588157] text-white hover:bg-[#344E41]">+ Planner</button>
                    </div>
                </article>
            `;
        }

        function createExcursionRow(place) {
            const fav = window.planner.isFavorite(place.id);
            return `
                <article class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-6 items-center">
                    <div class="text-5xl shrink-0 bg-[#E9EDC9] w-20 h-20 flex items-center justify-center rounded-full">${place.icon}</div>
                    <div class="flex-grow text-center md:text-left w-full">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-2">
                            <h3 class="text-2xl font-bold text-[#344E41]">${place.title}</h3>
                            <button type="button" data-fav="${place.id}" class="text-xl" title="Preferito">${fav ? '★' : '☆'}</button>
                        </div>
                        <p class="text-gray-700 mb-2 leading-relaxed">${place.desc}</p>
                        ${place.hours ? `<p class="text-xs text-[#588157] font-semibold mb-3">🕐 ${place.hours}</p>` : ''}
                        <div class="flex flex-wrap gap-3 justify-center md:justify-start text-xs font-semibold mb-3">
                            <span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full">🚌/🚆 ${place.transport}</span>
                            <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full">⏱️ ${place.time}</span>
                            <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full">💶 ${place.cost}</span>
                        </div>
                        <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                            <a href="${place.url}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#E9EDC9] text-[#344E41] hover:bg-[#A3B18A]">Info & biglietti ↗</a>
                            ${place.lat != null ? `<button type="button" data-show-map="${place.id}" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#E9EDC9] text-[#344E41]">Mappa</button>` : ''}
                            <button type="button" data-add-plan="${place.id}" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-[#588157] text-white hover:bg-[#344E41]">+ Planner</button>
                        </div>
                    </div>
                </article>
            `;
        }

        function initBudgetChart() {
            const canvas = document.getElementById('budgetChart');
            if (!canvas) return;
            if (budgetChartInstance) {
                budgetChartInstance.destroy();
                budgetChartInstance = null;
            }
            const ctx = canvas.getContext('2d');
            
            const data = {
                labels: ['Cibo & Spesa quotidiana', 'Trasporti extra / Gite', 'Divertimento & Pub', 'Shopping & Souvenir'],
                datasets: [{
                    data: [250, 70, 180, 100],
                    backgroundColor: [
                        '#588157',
                        '#A3B18A',
                        '#D97757',
                        '#E9EDC9'
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            };

            const config = {
                type: 'doughnut',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: {
                                    family: "'Nunito', sans-serif"
                                },
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed !== null) {
                                        label += new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(context.parsed);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            };

            budgetChartInstance = new Chart(ctx, config);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const main = document.getElementById('main-content');
            main.innerHTML = '<div class="text-center text-gray-400 py-12">Caricamento guida…</div>';
            try {
                await loadAppData();
                initApp();
            } catch (e) {
                main.innerHTML = '<div class="text-center text-red-500 py-8">Impossibile caricare i dati.<br><span class="text-sm text-gray-500">Verifica che la cartella <code>data/</code> sia presente e che tu stia usando Live Server o GitHub Pages.</span></div>';
                console.error(e);
            }
        });

    </script>
</body>
</html>
